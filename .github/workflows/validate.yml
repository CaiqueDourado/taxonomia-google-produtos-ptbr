name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild from raw and check nothing changed
        run: |
          python scripts/build.py
          python scripts/docs.py
          git diff --exit-code -- data/*.csv data/*.json docs stats.json
      - name: Validate
        run: python scripts/validate.py
